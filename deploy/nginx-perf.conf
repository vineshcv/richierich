# Long cache for fingerprinted shop files (?v= on the URL).
location ^~ /assets/ {
    expires 365d;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
}

# Banner and product files. New uploads get a new filename.
# Replacing a file with the same name can stay cached for up to 30 days.
location ^~ /storage/ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    try_files $uri =404;
}
